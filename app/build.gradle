plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 飞书密钥从 gitignore 的 feishu.properties 读取（不进 git）
def feishuProps = new Properties()
def feishuFile = rootProject.file("feishu.properties")
if (feishuFile.exists()) feishuProps.load(new FileInputStream(feishuFile))

android {
    namespace 'com.example.floating'
    compileSdk 33

    defaultConfig {
        applicationId "com.example.floating"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "FEISHU_APP_ID", "\"${feishuProps.getProperty('appId', '')}\""
        buildConfigField "String", "FEISHU_APP_SECRET", "\"${feishuProps.getProperty('appSecret', '')}\""
        buildConfigField "String", "FEISHU_CHAT_ID", "\"${feishuProps.getProperty('chatId', '')}\""
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    testImplementation 'junit:junit:4.13.2'
}